# Déploiement continu vers Hugging Face Spaces.
# À chaque push, le code est envoyé vers ton Space qui se reconstruit tout seul.
#
# Configuration (une seule fois, voir README section "Site permanent") :
#   - secret  HF_TOKEN : token Hugging Face avec droit "write"
#   - variable HF_SPACE : "ton-pseudo/nom-du-space"

name: Déploiement Hugging Face Space

on:
  push:
    branches:
      - claude/tiktok-clip-generator-31rslv
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push vers le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
